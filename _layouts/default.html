<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">{% seo %}{% feed_meta %}<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"><script>try{document.documentElement.dataset.theme=localStorage.getItem('blog-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script></head>
<body><a class="skip" href="#main">본문으로 이동</a><div class="shell"><header><div class="topbar"><a class="brand" href="{{ '/' | relative_url }}">RuBP<span>의 기록</span><i>.</i></a><form class="search-form" action="{{ '/' | relative_url }}" role="search"><span aria-hidden="true">⌕</span><input type="search" name="q" id="search" placeholder="기록 검색" aria-label="기록 검색"></form></div><nav aria-label="주 메뉴"><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>홈</a><a href="{{ '/tags/' | relative_url }}" {% if page.url == '/tags/' %}aria-current="page"{% endif %}>태그</a><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>소개</a></nav></header>
<div class="page-grid"><main id="main">{{ content }}</main>{% include sidebar.html %}</div><footer><span>© {{ 'now' | date: '%Y' }} RuBP의 기록</span><div><a href="https://github.com/RuBP-curved">GitHub ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></div></footer></div>
<button id="theme" class="theme-toggle" type="button" aria-label="어두운 테마" aria-pressed="false"><span>Light</span><span class="switch"></span><span>Dark</span></button>
<script src="{{ '/assets/blog.js' | relative_url }}" defer></script></body></html>
