---
layout: default
---
<article class="article"><a class="back" href="{{ '/' | relative_url }}">← 모든 글</a><div class="eyebrow">{{ page.categories | join: ' · ' | escape }}</div><h1>{{ page.title | escape }}</h1><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time><div class="prose">{{ content }}</div>
<div class="post-nav">{% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title | escape }}</a>{% endif %}{% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title | escape }} →</a>{% endif %}</div></article>
